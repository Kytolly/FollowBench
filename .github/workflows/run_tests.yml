name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip' # 缓存 pip 依赖，加快后续运行速度

    - name: Install dependencies
      run: |
        # python -m pip install --upgrade pip
        # 安装 PyTorch CPU 版本以加快 CI 速度（单元测试通常不需要 GPU）
        # pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        # 安装其他依赖
        # if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install numpy scipy Pillow pyyaml transformers pyiqa pynvml; fi

    - name: Run Unit Tests
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # 使用自动发现模式运行 tests 目录下的所有测试
        # python -m unittest discover tests