<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fb_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7CC7FF"/>
      <stop offset="100%" stop-color="#C7A9FF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1E2A4A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="#F6FAFF"/>

  <g filter="url(#softShadow)">
    <circle cx="512" cy="512" r="330" fill="#FFFFFF"/>
  </g>

  <!-- Exo camera ring -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="url(#fb_grad)" stroke-width="28"/>

  <!-- Ego camera core -->
  <circle cx="512" cy="512" r="118" fill="#EAF4FF" stroke="#3D6FA8" stroke-width="14"/>
  <circle cx="512" cy="512" r="54" fill="#3D6FA8"/>

  <!-- Follow trajectory -->
  <path d="M288 640 C352 730, 460 782, 584 754 C674 734, 740 668, 770 586" fill="none" stroke="#8D6BDD" stroke-width="22" stroke-linecap="round"/>
  <circle cx="770" cy="586" r="22" fill="#8D6BDD"/>

  <!-- Direction arrow -->
  <path d="M757 558 L822 588 L760 624 Z" fill="#8D6BDD"/>

  <!-- Initial point -->
