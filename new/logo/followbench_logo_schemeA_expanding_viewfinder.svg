<svg width="1320" height="820" viewBox="0 0 1320 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .exo { stroke: #1E3557; fill: none; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
      .ego { stroke: #19D3E8; fill: #19D3E8; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .fov { stroke: #4A668F; fill: none; stroke-width: 8; stroke-linecap: round; }
      .word { fill: #1E3557; font-family: "Comic Neue", "Segoe UI", Arial, sans-serif; font-weight: 700; }
      .sub { fill: #4A668F; font-family: "Comic Neue", "Segoe UI", Arial, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- Transparent background -->

  <!-- Exo: tightened 16:9 style corner viewfinder -->
  <g>
    <!-- top-left corner (260,190) -->
    <path class="exo" d="M260 286 L260 190 L390 190"/>
    <!-- top-right corner (1060,190) -->
    <path class="exo" d="M930 190 L1060 190 L1060 286"/>
    <!-- bottom-left corner (260,630) -->
    <path class="exo" d="M260 534 L260 630 L390 630"/>
    <!-- bottom-right corner (1060,630) -->
    <path class="exo" d="M930 630 L1060 630 L1060 534"/>
  </g>

  <!-- Ego: eye icon (first-person perspective) -->
  <g transform="translate(650,410)">
    <ellipse cx="0" cy="0" rx="88" ry="56" fill="#E9FCFF" stroke="#19D3E8" stroke-width="12"/>
    <ellipse cx="0" cy="0" rx="32" ry="32" fill="#19D3E8"/>
    <!-- pupil as play button -->
    <polygon points="-8,-13 15,0 -8,13" fill="#FFFFFF"/>
  </g>

  <!-- FOV expansion lines -->
  <g>
    <!-- Four rays directly target the four frame corners -->
    <path class="fov" d="M628 352 L260 190"/>
    <path class="fov" d="M628 468 L260 630"/>
    <path class="fov" d="M672 352 L1060 190"/>
    <path class="fov" d="M672 468 L1060 630"/>
  </g>

  <!-- Bridge: minimal play symbol -->
  <g transform="translate(650,410)">
    <polygon points="-124,-8 -96,0 -124,8" fill="#4A668F" opacity="0.7"/>
    <polygon points="124,-8 96,0 124,8" fill="#4A668F" opacity="0.7"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(300,740)">
    <text class="word" x="0" y="0" font-size="82">FollowBench</text>
    <text class="sub" x="4" y="40" font-size="29">From Ego Footage to Exo World</text>
  </g>
</svg>
