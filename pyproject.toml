[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ego2exo_bench"
version = "0.1.0"
description = "Ego2Exo Benchmark Engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Ego2Exo Team" }
]
dependencies = []

[project.urls]
Homepage = "https://example.com/ego2exo-benchmark"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ego2exo_bench*", "configs"]

