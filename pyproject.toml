[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FollowBench"
version = "0.1.0"
description = "Follow Bench Engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "showlab" }
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Kytolly/FollowBench"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ego2exo_bench*", "configs"]

[tool.flake8]
max-line-length = 100
# Enable checking of type annotations via flake8-annotations plugin
extend-select = ["ANN"]
# Common ignores for stylistic preferences (E203 conflicts with black, W503 line break)
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv", ".eggs"]
# Relax some checks in tests and docs
per-file-ignores = [
  "tests/*: D101,D102,D103,ANN",
  "docs/*: D100,D101",
]


